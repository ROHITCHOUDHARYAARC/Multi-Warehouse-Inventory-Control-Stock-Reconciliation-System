spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: inventory-api
              uri: lb://inventory-command-center
              predicates:
                - Path=/api/v1/**,/swagger-ui/**,/v3/api-docs/**
            - id: inventory-actuator
              uri: lb://inventory-command-center
              predicates:
                - Path=/actuator/**
server:
  port: ${SERVER_PORT:8080}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never
