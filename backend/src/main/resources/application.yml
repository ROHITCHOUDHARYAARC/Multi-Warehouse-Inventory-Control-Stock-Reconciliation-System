spring:
  application:
    name: inventory-command-center
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/multi_warehouse_inventory_db}
    username: ${DB_USERNAME:inventory_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration: ${JWT_EXPIRATION:3600}
    jwt-issuer: ${JWT_ISSUER:inventory-command-center}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
